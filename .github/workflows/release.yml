name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EasyTV Card ${{ github.ref_name }}
          body: |
            ## EasyTV Card ${{ github.ref_name }}

            ### Installation via HACS
            1. Add `https://github.com/LayzeeAutomation/EasyTV` as a custom HACS repository (Frontend)
            2. Install **EasyTV Card** from HACS
            3. Refresh your browser

            ### Manual Installation
            Download `easytv-card.js` below and copy it to your `www/` folder.
          files: easytv-card.js
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
