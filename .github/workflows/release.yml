name: Attach release asset

on:
  release:
    types: [published]

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Upload easytv-card.js to release
        uses: softprops/action-gh-release@v2
        with:
          files: easytv-card.js
